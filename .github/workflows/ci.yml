name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend test
          node webtests/client_crypto_test.mjs

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Browser audio regressions
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test with race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Scan known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Verify release targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/dawnmesh-server-amd64 ./cmd/dawnmesh-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/dawnmesh-server-arm64 ./cmd/dawnmesh-server
