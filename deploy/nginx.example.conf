# Put these locations in the HTTPS server block managed by your existing Nginx.
# Certificate configuration intentionally stays outside this project.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    # Preserve the browser-visible host and WebSocket credential protocols.
    # $http_host keeps a non-standard HTTPS port, which is needed for Origin checks.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Dawn-Session $http_x_dawn_session;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_pass_header Sec-WebSocket-Protocol;
    # The server also sends a WebSocket ping every 20 seconds. Keep a generous
    # proxy timeout for suspended mobile browser tabs and temporary stalls.
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Embedded administration console. Consider adding allow/deny rules here.
location = /admin {
    return 308 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Embedded browser intercom client. Do not include
# $http_sec_websocket_protocol in access-log formats because the browser uses
# that request header for its encoded access and session credentials.
location = /client {
    return 308 /client/;
}

location /client/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Use a separate rtc.example.com HTTPS server block for LiveKit signalling.
location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Media is not HTTP. LiveKit uses host networking and directly binds UDP 57882
# and TCP 57881 on IPv4 and IPv6. Nginx on the same host cannot bind those same
# address/port pairs. A separate gateway can use ngx_stream_module like this:
# stream {
#   upstream livekit_udp { server LIVEKIT_PRIVATE_IP:57882; }
#   server { listen 57882 udp reuseport; listen [::]:57882 udp reuseport; proxy_pass livekit_udp; proxy_timeout 10m; }
#   upstream livekit_tcp { server LIVEKIT_PRIVATE_IP:57881; }
#   server { listen 57881; listen [::]:57881; proxy_pass livekit_tcp; proxy_timeout 1h; }
# }
