# Put these locations in the HTTPS server block managed by your existing Nginx.
# Certificate configuration intentionally stays outside this project.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_buffering off;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Embedded administration console. Consider adding allow/deny rules here.
location = /admin {
    return 308 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Use a separate rtc.example.com HTTPS server block for LiveKit signalling.
location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Media is not HTTP. Prefer direct firewall/NAT mappings for UDP 7882 and TCP 7881.
# If Nginx was built with ngx_stream_module, an outer stream block may be used:
