# Put these locations in the HTTPS server block managed by your existing Nginx.
# Certificate configuration intentionally stays outside this project.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_buffering off;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Embedded administration console. Consider adding allow/deny rules here.
location = /admin {
    return 308 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Use a separate rtc.example.com HTTPS server block for LiveKit signalling.
location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Media is not HTTP. LiveKit uses host networking and directly binds UDP 57882
# and TCP 57881 on IPv4 and IPv6. Nginx on the same host cannot bind those same
# address/port pairs. A separate gateway can use ngx_stream_module like this:
# stream {
#   upstream livekit_udp { server LIVEKIT_PRIVATE_IP:57882; }
#   server { listen 57882 udp reuseport; listen [::]:57882 udp reuseport; proxy_pass livekit_udp; proxy_timeout 10m; }
#   upstream livekit_tcp { server LIVEKIT_PRIVATE_IP:57881; }
#   server { listen 57881; listen [::]:57881; proxy_pass livekit_tcp; proxy_timeout 1h; }
# }
