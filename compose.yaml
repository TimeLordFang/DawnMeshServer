services:
  dawnmesh-server:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - dawnmesh-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      # Enable only when TURN/UDP is configured.
      # - "3478:3478/udp"
    expose:
      - "7880"

volumes:
  dawnmesh-data:
