services:
  dawnmesh-server:
    image: ${DAWNMESH_IMAGE:-ghcr.io/timelordfang/dawnmeshserver:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - dawnmesh-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Keep LIVEKIT_URL=http://livekit:7880 working after LiveKit moves to the
      # host network by resolving the old service name to the Docker host.
      - "livekit:host-gateway"
    depends_on:
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  dawnmesh-data:
